; font_ttf.ini - FontTXD TTF configuration
; Settings, parameters for TTF rendering, and GXT Colors
[Settings]
; Key to reload font settings in-game (Virtual Key code, 0 = disabled)
; NOTE: 162 = VK_LCONTROL caused an in-game hitch on every Ctrl press.
ReloadKey=0
; Rendering method (1 = D3DX font sprite, 2 = GDI sprite)
RenderMethod=2
; Replace text shadow with outline (1 = shadow size, >1 = exact thickness)
ReplaceShadowWithOutline=0
; Force uniform scaling for all fonts (1 = enable, 0 = disable)
UniformFontScale=0
; Force default settings override for game style (-1 = off, 0 = GTA III, 1 = GTA VC, 2 = GTA SA, 3 = GTA IV, 4 = GTA V, 5 = GTA LCS, 6 = GTA VCS)
DefaultOverride=-1
; Smooth outline quality (number of sampling points in a circle, e.g. 16)
OutlineQuality=16
; Outline size multiplier (defaults: 1.0f for III/VC, 2.0f for SA)
OutlineSizeMultiplier=2.00
; Size scale multiplier of prompt buttons (default: 0.85)
ButtonSizeMultiplier=0.85
; Override outline thickness (GTA SA only, -1 to disable)
OutlineSizeOverride=-1
; Enable Bidirectional & RTL layout support for Arabic/Hebrew/Urdu/Farsi (1 = enable, 0 = disable)
EnableRTL=1
; Position offset (X Y) for Health/Armor HUD symbols
HealthArmorSymbolXYPos=10.00 3.00
; Position offset (X Y) for Wanted star HUD symbols
WantedSymbolXYPos=30.00 3.00
; Scale multiplier (X Y) for Health/Armor symbols
HealthArmorSymbolScaleMultiplier=1.30 0.90
; Scale multiplier (X Y) for Wanted star symbols
WantedScaleMultiplier=2.30 1.30
; Disable character slant/italic slant rendering
DisableSlant=0
; Follow natural character widths globally (1 = enable, 0 = disable)
FollowNaturalCharWidthGlobal=1
; Global Y coordinate offset for text rendering
CharYPosGlobalOffset=-1.00
[Font0]
; TrueType Font (.ttf or .otf) file name
FontFile=ChulabhornLikitText-Regular.ttf
; Font character set index
FontCharSet=1
; Font size (height in pixels)
FontSize=64
; Font width in pixels (0 for default)
FontWidth=48
; Antialiasing quality setting
FontQuality=0
; Width of space character (0 for default)
FontSpaceWidth=48
; Render font in italic (1 = enable, 0 = disable)
FontItalic=0
; Font weight (e.g. 400 = Normal, 700 = Bold)
FontWeight=400
; Line height spacing multiplier (0.0 for default)
FontLineHeight=32.00
